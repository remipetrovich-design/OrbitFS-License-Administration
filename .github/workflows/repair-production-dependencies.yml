name: Repair production dependency lockfile

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/repair-production-dependencies.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: license-manager-dependency-repair-main
  cancel-in-progress: false

jobs:
  repair:
    if: github.repository == 'remipetrovich-design/OrbitFS-License-Administration' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout current main
        uses: actions/checkout@v6
        with:
          ref: main
          persist-credentials: true
      - name: Set up Node 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Update vulnerable dependencies within supported version ranges
        run: |
          set -euo pipefail
          npm ci
          npm audit fix --omit=dev --package-lock-only --ignore-scripts --no-fund
          npm ci
          npm audit --omit=dev --audit-level=high
          node - <<'NODE'
          const lock = require('./package-lock.json');
          for (const [name, safe] of [
            ['next', v => {
              const parts = v.split('.').map(Number);
              return parts[0] > 15 || (parts[0] === 15 && (parts[1] > 5 || (parts[1] === 5 && parts[2] > 26)));
            }],
            ['sharp', v => {
              const parts = v.split('.').map(Number);
              return parts[0] > 0 || parts[1] > 35 || (parts[1] === 35 && parts[2] >= 5);
            }],
            ['source-map-js', v => {
              const parts = v.split('.').map(Number);
              return parts[0] > 1 || (parts[0] === 1 && (parts[1] > 2 || (parts[1] === 2 && parts[2] > 1)));
            }]
          ]) {
            const value = lock.packages['node_modules/' + name]?.version;
            if (!value || !safe(value)) throw new Error(name + ' remains below the audited patched version: ' + value);
            console.log('Patched', name, value);
          }
          NODE
      - name: Run complete production preflight and tests
        run: |
          set -euo pipefail
          npm run preflight
          node scripts/release-manifest.test.mjs
          node --test scripts/github-profile-switch-contract.test.mjs
          node --test scripts/source-activation-contract.test.mjs
          git diff --check
      - name: Upload audited lockfile for recovery
        uses: actions/upload-artifact@v4
        with:
          name: repaired-production-dependency-lock
          path: |
            package-lock.json
            package.json
          retention-days: 7
      - name: Commit verified dependency repair to main
        run: |
          set -euo pipefail
          git add package-lock.json package.json
          if git diff --cached --quiet; then
            echo 'Dependency lockfile already satisfies the production audit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Fix vulnerable production dependency lockfile after audit'
          git fetch origin main
          if test "$(git rev-parse origin/main)" != "$(git rev-parse HEAD^)"; then
            echo 'Main advanced during repair; refusing non-fast-forward commit.'
            exit 1
          fi
          git push origin HEAD:main
