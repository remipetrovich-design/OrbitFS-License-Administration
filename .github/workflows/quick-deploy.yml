name: Quick Deploy

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: license-master-quick
  cancel-in-progress: true

jobs:
  deploy:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: team_W3fS0X03YCjNkD2BoqRj6Uld
      VERCEL_PROJECT_ID: prj_rxRaSrRX2xwnmJ21zfjYL31RkLsv
      VERCEL_CLI_VERSION: 59.23.1

    steps:
      - name: Checkout selected main commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Verify quick-deploy source
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_EVENT_NAME}" = "workflow_dispatch"
          test "${GITHUB_REF}" = "refs/heads/main"
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test -n "$VERCEL_TOKEN"
          test -n "$VERCEL_ORG_ID"
          test -n "$VERCEL_PROJECT_ID"

      - name: Install pinned Vercel CLI
        run: |
          npm install --global "vercel@$VERCEL_CLI_VERSION"
          vercel --version

      - name: Quick deploy main to production
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          deployment_url="$(vercel deploy --prod --yes --token="$VERCEL_TOKEN" --scope="$VERCEL_ORG_ID")"
          case "$deployment_url" in
            https://*) ;;
            *) echo "::error::Vercel did not return a production deployment URL"; exit 1 ;;
          esac
          echo "url=$deployment_url" >> "$GITHUB_OUTPUT"

      - name: Verify deployment exists
        run: vercel inspect "${{ steps.deploy.outputs.url }}" --token="$VERCEL_TOKEN" --scope="$VERCEL_ORG_ID"

      - name: Report quick deployment
        run: |
          echo "Quick deployment completed."
          echo "Branch: main"
          echo "Commit: $GITHUB_SHA"
          echo "Deployment: ${{ steps.deploy.outputs.url }}"
