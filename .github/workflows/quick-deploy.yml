name: Quick Deploy

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: license-master-production
  cancel-in-progress: true

jobs:
  deploy:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
      VERCEL_CLI_VERSION: 59.23.1

    steps:
      - name: Checkout complete main history at selected commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Verify quick-deploy source
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_EVENT_NAME}" = "workflow_dispatch"
          test "${GITHUB_REF}" = "refs/heads/main"
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test "$(git rev-parse --is-shallow-repository)" = "false"
          git fetch origin main --prune
          test "$(git rev-parse origin/main)" = "${GITHUB_SHA}"
          test -n "$VERCEL_TOKEN"
          test -n "$VERCEL_ORG_ID"
          test -n "$VERCEL_PROJECT_ID"
          test -f package-lock.json
          test -f vercel.json
          node - <<'NODE'
          const fs=require('fs');
          const config=JSON.parse(fs.readFileSync('vercel.json','utf8'));
          if(config?.git?.deploymentEnabled!==false) {
            throw new Error('Quick Deploy policy violation: automatic Vercel Git deployments must remain disabled');
          }
          NODE

      - name: Use Node 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Resolve previous production deployment
        id: production_state
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v6/deployments?projectId=$VERCEL_PROJECT_ID&target=production&state=READY&limit=1&teamId=$VERCEL_ORG_ID")"
          deployed_sha="$(printf '%s' "$response" | jq -r '.deployments[0].meta.githubCommitSha // empty')"
          deployed_url="$(printf '%s' "$response" | jq -r '.deployments[0].url // empty')"
          echo "deployed_sha=$deployed_sha" >> "$GITHUB_OUTPUT"
          if [ -n "$deployed_url" ]; then
            echo "deployment_url=https://$deployed_url" >> "$GITHUB_OUTPUT"
          fi
          if [ "$deployed_sha" = "$GITHUB_SHA" ]; then
            echo "already_deployed=true" >> "$GITHUB_OUTPUT"
            echo "Exact commit is already the latest READY production deployment."
          else
            echo "already_deployed=false" >> "$GITHUB_OUTPUT"
            echo "Previous production commit: ${deployed_sha:-none}"
            echo "Target production commit: $GITHUB_SHA"
          fi

      - name: Generate complete since-last-deploy change manifest
        env:
          RELEASE_BASE_SHA: ${{ steps.production_state.outputs.deployed_sha }}
        run: node scripts/release-manifest.mjs

      - name: Upload quick-deploy change manifest
        uses: actions/upload-artifact@v4
        with:
          name: quick-deploy-change-set-${{ github.sha }}
          path: release-manifest.json
          if-no-files-found: error
          retention-days: 90

      - name: Install pinned Vercel CLI
        if: steps.production_state.outputs.already_deployed != 'true'
        run: |
          npm install --global "vercel@$VERCEL_CLI_VERSION"
          vercel --version

      - name: Pull production configuration only
        if: steps.production_state.outputs.already_deployed != 'true'
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN" --scope="$VERCEL_ORG_ID"

      - name: Verify pulled production project identity
        if: steps.production_state.outputs.already_deployed != 'true'
        shell: bash
        run: |
          set -euo pipefail
          test -f .vercel/project.json
          node - <<'NODE'
          const fs=require('fs');
          const project=JSON.parse(fs.readFileSync('.vercel/project.json','utf8'));
          if(project.orgId!==process.env.VERCEL_ORG_ID) throw new Error('Vercel org mismatch');
          if(project.projectId!==process.env.VERCEL_PROJECT_ID) throw new Error('Vercel project mismatch');
          NODE

      - name: Build quick-deploy artifact without deploying
        if: steps.production_state.outputs.already_deployed != 'true'
        run: vercel build --prod --yes --token="$VERCEL_TOKEN" --scope="$VERCEL_ORG_ID"

      - name: Verify quick-deploy artifact locally
        if: steps.production_state.outputs.already_deployed != 'true'
        shell: bash
        run: |
          set -euo pipefail
          test -f .vercel/output/config.json
          test -d .vercel/output/functions -o -d .vercel/output/static
          node - <<'NODE'
          const fs=require('fs');
          const config=JSON.parse(fs.readFileSync('.vercel/output/config.json','utf8'));
          if(Number(config.version)!==3) throw new Error('Unexpected Vercel Build Output API version');
          NODE

      - name: Deploy quick artifact to production
        if: steps.production_state.outputs.already_deployed != 'true'
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          deployment_url="$(vercel deploy --prebuilt --archive=tgz --prod --yes --token="$VERCEL_TOKEN" --scope="$VERCEL_ORG_ID")"
          case "$deployment_url" in
            https://*) ;;
            *) echo "::error::Vercel did not return a production deployment URL"; exit 1 ;;
          esac
          echo "url=$deployment_url" >> "$GITHUB_OUTPUT"
          echo "Quick deployment completed."
          echo "Branch: main"
          echo "Commit: $GITHUB_SHA"
          echo "Deployment: $deployment_url"

      - name: Reuse existing production deployment
        if: steps.production_state.outputs.already_deployed == 'true'
        run: |
          echo "Quick deployment not required."
          echo "Commit: $GITHUB_SHA"
          echo "Deployment: ${{ steps.production_state.outputs.deployment_url }}"
