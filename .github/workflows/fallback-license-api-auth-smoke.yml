name: Fallback License Manager Authenticated API Smoke
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/fallback-license-api-auth-smoke.yml
permissions:
  contents: read
jobs:
  verify:
    if: github.repository == 'remipetrovich-design/OrbitFS-License-Administration'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: team_0fWVaLb24pyeeCRqqYu5G47K
      VERCEL_PROJECT_ID: prj_rCooJWY8JMkBjekXLO8scT35UPJ8
      VERCEL_SCOPE: splashincau-7868s-projects
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Retrieve Fallback-only secret configuration
        run: |
          set -euo pipefail
          test -n "$VERCEL_TOKEN"
          npm install --global vercel@59.23.1
          vercel pull --yes --environment=production --token="$VERCEL_TOKEN" --scope="$VERCEL_SCOPE" >/dev/null
          node - <<'NODE'
          const p = require('./.vercel/project.json');
          if(p.orgId!==process.env.VERCEL_ORG_ID || p.projectId!==process.env.VERCEL_PROJECT_ID) {
            throw new Error('Aborted: incorrect Vercel project');
          }
          NODE
      - name: Test scoped machine-key API reads
        shell: bash
        run: |
          set -euo pipefail
          node --env-file=.vercel/.env.production.local <<'NODE'
          const base = 'https://lm.incendiarynetworks.cc/api/v1';
          const token = process.env.MASTER_API_TOKEN;
          if (!token) throw new Error('Fallback MASTER_API_TOKEN is missing from production configuration');
          const tests = [
            ['/releases?product=orbitfs_base&channel=stable&type=base', 'releases'],
            ['/release-channels', 'channels'],
            ['/license?license_ids=00000000-0000-4000-8000-000000000000', 'licenses']
          ];
          for (const [path, key] of tests) {
            const response = await fetch(base+path, {headers:{authorization:'Bearer '+token}, cache:'no-store', signal:AbortSignal.timeout(15000)});
            if(!response.ok)throw new Error(path+' returned HTTP '+response.status+' with a configured Fallback machine token');
            const result=await response.json();
            if(!Array.isArray(result[key]))throw new Error(path+' response missing '+key+' array');
            console.log('AUTHORIZED '+key+': HTTP '+response.status);
          }
          const r = await fetch(base+'/api-connections?client=v1_base&service=license_runtime', {cache:'no-store'});
          if (!r.ok) throw new Error('Runtime registry returned HTTP '+r.status);
          const registry = await r.json();
          const urls=(registry.connections||[]).map(x=>x.base_url);
          if (!urls.includes(base+'/license'))throw new Error('Fallback runtime registry has incorrect API origin');
          console.log('Runtime API registry: Fallback URL verified');
          NODE
