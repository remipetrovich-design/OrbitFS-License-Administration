name: Dispatch License Manager DB fix deploy

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/dispatch-db-fix-deploy.yml

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch Quick Deploy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error -X POST             -H "Authorization: Bearer $GH_TOKEN"             -H "Accept: application/vnd.github+json"             -H "X-GitHub-Api-Version: 2022-11-28"             "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/quick-deploy.yml/dispatches"             -d '{"ref":"main"}'
