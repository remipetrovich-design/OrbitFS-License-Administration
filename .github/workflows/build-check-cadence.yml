name: License Build Check Cadence

on:
  push:
    branches: [main]
    paths-ignore:
      - ".github/workflows/**"

permissions:
  actions: read
  contents: read

concurrency:
  group: license-build-cadence-main
  cancel-in-progress: false

jobs:
  cadence:
    name: Check build cadence
    runs-on: ubuntu-latest
    outputs:
      due: ${{ steps.cadence.outputs.due }}
    steps:
      - name: Checkout commit history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Run build check after five meaningful commits
        id: cadence
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/$GITHUB_REPOSITORY"
          response="$(curl --fail --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$api/actions/workflows/build-check.yml/runs?branch=main&status=success&per_page=1")"
          baseline="$(printf '%s' "$response" | jq -r '.workflow_runs[0].head_sha // empty')"

          if [ -z "$baseline" ]; then
            echo "due=true" >> "$GITHUB_OUTPUT"
            echo "No successful License build check baseline exists; a build check is due."
            exit 0
          fi

          if ! git cat-file -e "$baseline^{commit}" 2>/dev/null; then
            echo "due=true" >> "$GITHUB_OUTPUT"
            echo "License build check baseline $baseline is outside local history; a build check is due."
            exit 0
          fi

          if ! git merge-base --is-ancestor "$baseline" "$GITHUB_SHA"; then
            echo "due=true" >> "$GITHUB_OUTPUT"
            echo "License build check baseline is not an ancestor of current main; a build check is due."
            exit 0
          fi

          count="$(git rev-list --count "$baseline..$GITHUB_SHA" -- . ':(exclude).github/workflows/**')"
          echo "Meaningful commits since License build check baseline $baseline: $count"

          if [ "$count" -ge 5 ]; then
            echo "due=true" >> "$GITHUB_OUTPUT"
            echo "License build check is due after $count meaningful commits."
          else
            echo "due=false" >> "$GITHUB_OUTPUT"
            echo "Skipping License build check until 5 meaningful commits accumulate."
          fi

  build-check:
    name: Scheduled License build check
    needs: cadence
    if: needs.cadence.outputs.due == 'true'
    uses: ./.github/workflows/build-check.yml
    secrets: inherit
