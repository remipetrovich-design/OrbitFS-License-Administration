name: Production Deploy

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: license-master-production
  cancel-in-progress: true

jobs:
  deploy:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: production
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: team_0fWVaLb24pyeeCRqqYu5G47K
      VERCEL_PROJECT_ID: prj_rCooJWY8JMkBjekXLO8scT35UPJ8
      VERCEL_CLI_VERSION: 59.23.1

    steps:
      - name: Check active GitHub profile
        id: profile
        shell: bash
        env:
          EXPECTED_GITHUB_PROFILE: fallback
        run: |
          set -euo pipefail
          response="$(curl --fail --silent --show-error --retry 2 --retry-delay 2 https://incendiarynetworks.cc/api/v1/github-profile)"
          active="$(node -e 'const x=JSON.parse(process.argv[1]); process.stdout.write(String(x.profile||""))' "$response")"
          echo "Active GitHub profile: $active"
          echo "Expected for this repository: $EXPECTED_GITHUB_PROFILE"
          if [ "$active" != "$EXPECTED_GITHUB_PROFILE" ]; then
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "Inactive GitHub profile. This workflow will not access source, scan, build or deploy production."
            exit 0
          fi
          echo "deploy=true" >> "$GITHUB_OUTPUT"

      - name: Checkout complete repository history at selected commit
        if: steps.profile.outputs.deploy == 'true'
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Verify immutable production source
        if: steps.profile.outputs.deploy == 'true'
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_EVENT_NAME}" = "workflow_dispatch"
          test "${GITHUB_REF}" = "refs/heads/main"
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test "$(git rev-parse --is-shallow-repository)" = "false"
          git fetch --no-tags --prune origin +refs/heads/main:refs/remotes/origin/main
          main_sha="$(git rev-parse refs/remotes/origin/main)"
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" "$main_sha"; then
            echo "::error::Selected deployment commit ${GITHUB_SHA} is no longer part of current main history (${main_sha})."
            exit 1
          fi
          if [ "$main_sha" != "${GITHUB_SHA}" ]; then
            echo "main advanced after workflow dispatch."
            echo "Selected deployment commit: ${GITHUB_SHA}"
            echo "Current main commit: $main_sha"
            echo "Continuing with the immutable commit captured by workflow_dispatch."
          fi
          test -f package-lock.json
          test -f vercel.json
          node - <<'NODE'
          const fs=require('fs');
          const config=JSON.parse(fs.readFileSync('vercel.json','utf8'));
          if(config?.git?.deploymentEnabled!==false) {
            throw new Error('Production policy violation: automatic Vercel Git deployments must remain disabled');
          }
          NODE

      - name: Verify exact commit passed Full Scan
        if: steps.profile.outputs.deploy == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          runs="$(gh api -H "Accept: application/vnd.github+json" "/repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?branch=main&event=workflow_dispatch&per_page=50")"
          scan="$(printf '%s' "$runs" | jq -c --arg sha "$GITHUB_SHA" '[.workflow_runs[] | select(.head_sha == $sha)] | sort_by(.created_at) | reverse | .[0] // empty')"
          if [ -z "$scan" ]; then
            echo "::error::Deploy blocked: no Full Scan workflow_dispatch run exists for exact commit $GITHUB_SHA."
            exit 1
          fi
          status="$(printf '%s' "$scan" | jq -r '.status // empty')"
          conclusion="$(printf '%s' "$scan" | jq -r '.conclusion // empty')"
          url="$(printf '%s' "$scan" | jq -r '.html_url // empty')"
          if [ "$status" != "completed" ] || [ "$conclusion" != "success" ]; then
            echo "::error::Deploy blocked: Full Scan for exact commit $GITHUB_SHA is $status/$conclusion."
            [ -n "$url" ] && echo "Full Scan: $url"
            exit 1
          fi
          echo "Reusing successful Full Scan for exact commit $GITHUB_SHA."
          [ -n "$url" ] && echo "Full Scan: $url"

      - name: Use Node 22
        if: steps.profile.outputs.deploy == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Resolve previous production deployment for this repository
        if: steps.profile.outputs.deploy == 'true'
        id: production_state
        shell: bash
        run: |
          set -euo pipefail
          test -n "$VERCEL_TOKEN"
          test -n "$VERCEL_ORG_ID"
          test -n "$VERCEL_PROJECT_ID"
          response="$(curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v6/deployments?projectId=$VERCEL_PROJECT_ID&target=production&state=READY&limit=100&teamId=$VERCEL_ORG_ID")"
          repo_row="$(printf '%s' "$response" | jq -c --arg repo "$GITHUB_REPOSITORY" '
            [.deployments[]? | select((((.meta.githubOrg // "") + "/" + (.meta.githubRepo // "")) == $repo))][0] // empty
          ')"
          current_row="$(printf '%s' "$response" | jq -c '.deployments[0] // empty')"
          deployed_sha="$(printf '%s' "$repo_row" | jq -r '.meta.githubCommitSha // empty')"
          deployed_url="$(printf '%s' "$repo_row" | jq -r '.url // empty')"
          current_sha="$(printf '%s' "$current_row" | jq -r '.meta.githubCommitSha // empty')"
          current_repository="$(printf '%s' "$current_row" | jq -r '((.meta.githubOrg // "") + "/" + (.meta.githubRepo // ""))')"
          current_url="$(printf '%s' "$current_row" | jq -r '.url // empty')"
          echo "deployed_sha=$deployed_sha" >> "$GITHUB_OUTPUT"
          if [ "$current_repository" = "$GITHUB_REPOSITORY" ] && [ "$current_sha" = "$GITHUB_SHA" ]; then
            echo "already_deployed=true" >> "$GITHUB_OUTPUT"
            if [ -n "$current_url" ]; then
              echo "deployment_url=https://$current_url" >> "$GITHUB_OUTPUT"
            fi
            echo "Exact commit from $GITHUB_REPOSITORY is already the latest READY production deployment."
          else
            echo "already_deployed=false" >> "$GITHUB_OUTPUT"
            echo "Previous production commit from this repository: ${deployed_sha:-none}"
            echo "Current shared production repository: ${current_repository:-unknown}"
            echo "Target repository: $GITHUB_REPOSITORY"
            echo "Target production commit: $GITHUB_SHA"
          fi

      - name: Generate complete since-last-deploy change manifest
        if: steps.profile.outputs.deploy == 'true'
        env:
          RELEASE_BASE_SHA: ${{ steps.production_state.outputs.deployed_sha }}
        run: node scripts/release-manifest.mjs

      - name: Upload release/change-set manifest
        if: steps.profile.outputs.deploy == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: production-release-${{ github.sha }}
          path: release-manifest.json
          if-no-files-found: error
          retention-days: 90

      - name: Install pinned Vercel CLI
        if: ${{ steps.profile.outputs.deploy == 'true' && (steps.production_state.outputs.already_deployed != 'true') }}
        run: |
          npm install --global "vercel@$VERCEL_CLI_VERSION"
          vercel --version

      - name: Pull production configuration only
        if: ${{ steps.profile.outputs.deploy == 'true' && (steps.production_state.outputs.already_deployed != 'true') }}
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN" --scope="$VERCEL_ORG_ID"

      - name: Verify pulled production project identity
        if: ${{ steps.profile.outputs.deploy == 'true' && (steps.production_state.outputs.already_deployed != 'true') }}
        shell: bash
        run: |
          set -euo pipefail
          test -f .vercel/project.json
          node - <<'NODE'
          const fs=require('fs');
          const project=JSON.parse(fs.readFileSync('.vercel/project.json','utf8'));
          if(project.orgId!==process.env.VERCEL_ORG_ID) throw new Error('Vercel org mismatch');
          if(project.projectId!==process.env.VERCEL_PROJECT_ID) throw new Error('Vercel project mismatch');
          NODE

      - name: Build exact production artifact without deploying
        if: ${{ steps.profile.outputs.deploy == 'true' && (steps.production_state.outputs.already_deployed != 'true') }}
        run: vercel build --prod --yes --token="$VERCEL_TOKEN" --scope="$VERCEL_ORG_ID"

      - name: Verify prebuilt production artifact locally
        if: ${{ steps.profile.outputs.deploy == 'true' && (steps.production_state.outputs.already_deployed != 'true') }}
        shell: bash
        run: |
          set -euo pipefail
          test -f .vercel/output/config.json
          test -d .vercel/output/functions -o -d .vercel/output/static
          node - <<'NODE'
          const fs=require('fs');
          const config=JSON.parse(fs.readFileSync('.vercel/output/config.json','utf8'));
          if(Number(config.version)!==3) throw new Error('Unexpected Vercel Build Output API version');
          NODE

      - name: Reuse existing production deployment
        if: ${{ steps.profile.outputs.deploy == 'true' && (steps.production_state.outputs.already_deployed == 'true') }}
        run: |
          echo "Production deployment not required."
          echo "Commit: $GITHUB_SHA"
          echo "Deployment: ${{ steps.production_state.outputs.deployment_url }}"

      - name: Deploy exact validated prebuilt artifact to production
        if: ${{ steps.profile.outputs.deploy == 'true' && (steps.production_state.outputs.already_deployed != 'true') }}
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          github_org="${GITHUB_REPOSITORY%%/*}"
          github_repo="${GITHUB_REPOSITORY#*/}"
          deployment_url="$(vercel deploy --prebuilt --archive=tgz --prod --yes \
            --token="$VERCEL_TOKEN" \
            --scope="$VERCEL_ORG_ID" \
            --meta "githubCommitSha=$GITHUB_SHA" \
            --meta "githubCommitRef=main" \
            --meta "githubOrg=$github_org" \
            --meta "githubRepo=$github_repo")"
          case "$deployment_url" in
            https://*) ;;
            *) echo "::error::Vercel did not return a production deployment URL"; exit 1 ;;
          esac
          echo "url=$deployment_url" >> "$GITHUB_OUTPUT"
          echo "Production deployment completed for immutable commit $GITHUB_SHA."
          echo "Deployment: $deployment_url"

