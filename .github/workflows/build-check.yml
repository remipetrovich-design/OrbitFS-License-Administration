name: License Master Build Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: license-master-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check active GitHub profile
        id: profile
        shell: bash
        env:
          EXPECTED_GITHUB_PROFILE: fallback
        run: |
          set -euo pipefail
          profile_file="$(mktemp)"
          trap 'rm -f "$profile_file"' EXIT
          status="$(curl --silent --show-error --retry 2 --retry-delay 2 --output "$profile_file" --write-out '%{http_code}' https://incendiarynetworks.cc/api/v1/github-profile || true)"
          case "$status" in
            200)
              response="$(cat "$profile_file")"
              active="$(node -e 'const x=JSON.parse(process.argv[1]); process.stdout.write(String(x.profile||""))' "$response")"
              ;;
            404)
              active="fallback"
              echo "License Manager source-mode endpoint is not deployed yet; using the migration bootstrap default: fallback."
              ;;
            *)
              echo "::error::License Manager source-mode check failed (HTTP $status)."
              cat "$profile_file"
              exit 1
              ;;
          esac
          echo "Active GitHub profile: $active"
          echo "Expected for this repository: $EXPECTED_GITHUB_PROFILE"
          if [ "$active" != "$EXPECTED_GITHUB_PROFILE" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Inactive GitHub profile. Remaining workflow steps are disabled."
            exit 0
          fi
          echo "run=true" >> "$GITHUB_OUTPUT"

      - name: Checkout source
        if: steps.profile.outputs.run == 'true'
        uses: actions/checkout@v6

      - name: Use Node 22
        if: steps.profile.outputs.run == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        if: steps.profile.outputs.run == 'true'
        run: npm ci

      - name: Test release manifest local baseline resolution
        if: steps.profile.outputs.run == 'true'
        run: node scripts/release-manifest.test.mjs

      - name: Typecheck
        if: steps.profile.outputs.run == 'true'
        run: npm run typecheck

      - name: Production build
        if: steps.profile.outputs.run == 'true'
        run: npm run build
