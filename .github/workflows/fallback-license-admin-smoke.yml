name: Fallback License Manager Admin Smoke
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fallback-license-admin-smoke.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Test Fallback License Manager admin and read-only API endpoints
        env:
          BASE: https://lm.incendiarynetworks.cc
        shell: bash
        run: |
          set -euo pipefail
          dir="$(mktemp -d)"
          trap 'rm -rf "$dir"' EXIT
          check() {
            local name="$1" path="$2" expected="$3"
            local code
            code="$(curl -sS --retry 3 --retry-delay 2 --retry-connrefused --max-time 15 -o "$dir/$name.json" -w '%{http_code}' "$BASE$path")"
            echo "$name HTTP $code"
            if [ "$code" != "$expected" ]; then
              echo "::error::$name expected HTTP $expected, received HTTP $code"
              head -c 320 "$dir/$name.json" | sed 's/[[:cntrl:]]//g'
              echo
              exit 1
            fi
          }
          check login /login 200
          grep -qi 'sign in' "$dir/login.json" || { echo "::error::Admin login form missing"; exit 1; }
          check api_root /api/v1 200
          check health /api/v1/license/health 200
          node - "$dir/health.json" <<'NODE'
          const fs = require('fs');
          const body = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          if (body.ok !== true || body.service !== 'license-manager') {
            throw new Error('License Manager database health failed');
          }
          console.log('Database-backed health confirmed');
          console.log('External API authority enabled: ' + String(body.external_authority_online));
          NODE
          check source /api/v1/github-profile 200
          node - "$dir/source.json" <<'NODE'
          const fs = require('fs');
          const body = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          if (body.profile !== 'fallback') throw new Error('Unexpected source mode');
          console.log('Source mode confirmed: fallback');
          NODE
          check protected_releases /api/v1/releases 401
          echo 'Fallback admin login, database, source mode and API authorization smoke PASSED'
